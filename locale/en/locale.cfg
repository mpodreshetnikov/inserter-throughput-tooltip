[mod-name]
inserter-hover-throughput=Inserter Throughput Tooltip

[mod-description]
inserter-hover-throughput=Hover any inserter (or inserter ghost) to see its maximum throughput in the entity tooltip: items per second with research hand-size bonuses, quality, circuit/manual stack limits, belt stacking and belt speeds taken into account.

[mod-setting-name]
inserter-hover-throughput-prepare-ahead=Prepare tooltips for all inserters in advance
inserter-hover-throughput-show-details=Show hand stack size, cycle time and upper limit
inserter-hover-throughput-show-measured=Also show measured throughput
inserter-hover-throughput-show-label=Also show throughput above the hovered inserter

[mod-setting-description]
inserter-hover-throughput-prepare-ahead=Keeps the throughput lines in every inserter's tooltip, so they show up the moment you hover, also in multiplayer. Turn this off before removing the mod from a save: the mod then removes its lines from all inserters and says so in chat; save after that. When off, lines appear only after you hover an inserter.
inserter-hover-throughput-show-details=Adds the hand stack size breakdown, the swing cycle in ticks and the chest-to-chest upper limit to the inserter tooltip.
inserter-hover-throughput-show-measured=While you hover a working inserter, the mod counts the items it actually moves and shows the rate over the last 10 seconds.
inserter-hover-throughput-show-label=Draws the estimated throughput as text above the inserter you are hovering. Only you can see it.


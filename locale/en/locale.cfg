[mod-name]
inserter-throughput-tooltip=Inserter Throughput Tooltip

[mod-description]
inserter-throughput-tooltip=Hover any inserter (or inserter ghost) to see its maximum throughput in the entity tooltip: items per second with research hand-size bonuses, quality, circuit/manual stack limits, belt stacking and belt speeds taken into account.

[mod-setting-name]
inserter-throughput-show-details=Show hand stack size, cycle time and upper limit
inserter-throughput-show-measured=Also show measured throughput
inserter-throughput-show-label=Also show throughput above the hovered inserter

[mod-setting-description]
inserter-throughput-show-details=Adds the hand stack size breakdown, the swing cycle in ticks and the chest-to-chest upper limit to the inserter tooltip.
inserter-throughput-show-measured=While you hover a working inserter, the mod counts the items it actually moves and shows the rate over the last 10 seconds.
inserter-throughput-show-label=Draws the estimated throughput as text above the inserter you are hovering. Only you can see it.


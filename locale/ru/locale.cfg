[mod-name]
inserter-hover-throughput=Пропускная способность манипуляторов

[mod-description]
inserter-hover-throughput=Наведите курсор на любой манипулятор (или его призрак), чтобы увидеть в подсказке его максимальную пропускную способность: предметов в секунду с учётом исследований размера пачки, качества, ограничения стопки (вручную или по сети), стопок на конвейере и скорости конвейеров.

[mod-setting-name]
inserter-hover-throughput-prepare-ahead=Готовить подсказки для всех манипуляторов заранее
inserter-hover-throughput-show-details=Показывать размер пачки, цикл и предел
inserter-hover-throughput-show-measured=Дополнительно показывать измеренную скорость
inserter-hover-throughput-show-label=Дублировать скорость надписью над манипулятором

[mod-setting-description]
inserter-hover-throughput-prepare-ahead=Хранит строки пропускной способности в подсказке каждого манипулятора, поэтому они видны сразу при наведении, в том числе в мультиплеере. Выключите перед удалением мода из сохранения: мод уберёт свои строки со всех манипуляторов и сообщит об этом в чат, после этого сохраните игру. Если выключено, строки появляются только после наведения.
inserter-hover-throughput-show-details=Добавляет в подсказку размер пачки с разбивкой по бонусам, длительность цикла в тиках и предел для переноса «сундук → сундук».
inserter-hover-throughput-show-measured=Пока курсор наведён на работающий манипулятор, мод считает реально перенесённые предметы и показывает скорость за последние 10 секунд.
inserter-hover-throughput-show-label=Рисует расчётную скорость текстом над манипулятором под курсором. Видно только вам.

